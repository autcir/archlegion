# =============================================================================
# PACUSER CONFIGURATION FILE
# =============================================================================
# Questo file contiene tutte le configurazioni personalizzabili per PACUSER.
# Copia questo file e modifica i valori secondo le tue esigenze.
#
# Percorsi di ricerca (in ordine di priorità):
#   1. $PACUSER_CONFIG (variabile d'ambiente)
#   2. ./pacuser.conf (directory corrente)
#   3. ~/.config/pacuser/pacuser.conf
#   4. /etc/pacuser/pacuser.conf
# =============================================================================

# --- Configurazione Sistema ---
# Hostname del sistema (usato durante l'installazione chroot)
PACUSER_HOSTNAME="archlinux"

# Username principale (lascia vuoto per usare $USER corrente)
PACUSER_USERNAME=""

# Timezone (formato: Region/City)
PACUSER_TIMEZONE="Europe/Rome"

# Locale di sistema
PACUSER_LOCALE="it_IT.UTF-8"

# Layout tastiera
PACUSER_KEYMAP="it"

# --- Configurazione Git ---
# Questi valori verranno usati per configurare git globalmente
# Lascia vuoto per saltare la configurazione automatica
GIT_USER_NAME=""
GIT_USER_EMAIL=""

# --- Configurazione Docker ---
# Directory root per i dati Docker
# Default: /var/lib/docker
# Suggerimento: usa un disco separato per progetti grandi (es. /mnt/storage/docker)
PACUSER_DOCKER_ROOT="/var/lib/docker"

# Abilita NVIDIA Container Runtime (0=no, 1=sì)
PACUSER_DOCKER_NVIDIA="1"

# --- Configurazione Grafica ---
# Modalità Optimus Manager: hybrid, nvidia, intel
PACUSER_OPTIMUS_MODE="hybrid"

# Abilita Optimus Manager al boot (0=no, 1=sì)
PACUSER_ENABLE_OPTIMUS_MANAGER="0"

# --- Configurazione Power Management ---
# Abilita Intel Undervolt (0=no, 1=sì)
# ATTENZIONE: Modifica solo se sai cosa stai facendo
PACUSER_ENABLE_UNDERVOLT="1"

# Valori undervolt in mV (negativi = sottovolt)
PACUSER_UNDERVOLT_CPU="-80"
PACUSER_UNDERVOLT_GPU="-80"
PACUSER_UNDERVOLT_CACHE="-80"

# CPU Governor default: performance, powersave, schedutil
PACUSER_CPU_GOVERNOR="performance"

# --- Configurazione ZRAM ---
# Abilita ZRAM (0=no, 1=sì)
PACUSER_ENABLE_ZRAM="1"

# Dimensione ZRAM (es. "ram / 2", "4G", "8G")
PACUSER_ZRAM_SIZE="ram / 2"

# Algoritmo compressione: zstd, lz4, lzo
PACUSER_ZRAM_ALGORITHM="zstd"

# --- Configurazione Sicurezza ---
# Abilita UFW Firewall (0=no, 1=sì)
PACUSER_ENABLE_UFW="1"

# Abilita Fail2Ban (0=no, 1=sì)
PACUSER_ENABLE_FAIL2BAN="1"

# Porte da aprire nel firewall (separate da spazio)
# Default: SSH
PACUSER_UFW_ALLOW_PORTS="22"

# --- Configurazione IDE ---
# IDE da installare (separate da spazio)
# Opzioni: vscode, windsurf, antigravity
PACUSER_INSTALL_IDES="vscode windsurf"

# Abilita ottimizzazioni GPU per Electron (0=no, 1=sì)
PACUSER_ELECTRON_GPU_ACCEL="1"

# --- Configurazione Shell ---
# Shell da configurare: bash, zsh, fish
PACUSER_SHELL="bash"

# Abilita Starship prompt (0=no, 1=sì)
PACUSER_ENABLE_STARSHIP="1"

# Abilita Zoxide (cd intelligente) (0=no, 1=sì)
PACUSER_ENABLE_ZOXIDE="1"

# --- Configurazione Backup ---
# Directory per backup pre-format
PACUSER_BACKUP_ROOT="/mnt/storage/backups"

# --- Configurazione Avanzata ---
# Abilita modalità debug (mostra log dettagliati)
DEBUG="0"

# Salta conferme interattive (0=no, 1=sì)
# ATTENZIONE: Usare solo per installazioni automatizzate
PACUSER_UNATTENDED="0"

# Mirror countries per reflector (separati da virgola)
PACUSER_MIRROR_COUNTRIES="Italy,Germany,France"

# Numero download paralleli pacman
PACUSER_PARALLEL_DOWNLOADS="10"

# --- Hardware Specifico ---
# Forza rilevamento GPU (auto, nvidia_modern, nvidia_pascal, nvidia_maxwell, amd, intel)
PACUSER_FORCE_GPU="auto"

# Abilita Lenovo Legion tools (0=no, 1=auto, 2=force)
PACUSER_LEGION_TOOLS="1"

# --- Gruppi Utente ---
# Gruppi aggiuntivi per l'utente (separati da virgola)
PACUSER_USER_GROUPS="wheel,storage,power,audio,video,network,docker,libvirt,kvm"
