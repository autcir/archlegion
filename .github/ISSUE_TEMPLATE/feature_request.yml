name: Feature request
description: Suggest a script, config, or hardware-support addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware this applies to
      description: |
        archlegion targets the Lenovo Legion Y520. Additions for other models are
        welcome as long as they do not change the defaults for that machine.
      placeholder: Lenovo Legion Y530, i5-8300H, GTX 1050
    validations:
      required: true

  - type: checkboxes
    id: risk
    attributes:
      label: Risk
      options:
        - label: This touches undervolt, fan curves, firmware, or boot
        - label: I am willing to test this on my own hardware
